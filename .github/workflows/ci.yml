name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # 后端：静态检查
  # ===========================================================================
  backend-lint:
    name: Backend · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff pyright

      - name: Ruff
        run: ruff check app/ tests/

      - name: Pyright
        run: pyright app/

  # ===========================================================================
  # 后端：测试
  # ===========================================================================
  backend-test:
    name: Backend · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

  # ===========================================================================
  # 前端：静态检查 + 构建
  # ===========================================================================
  frontend-lint:
    name: Frontend · Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ===========================================================================
  # 前端：端到端（真后端 + 真构建产物）
  # ===========================================================================
  frontend-e2e:
    name: Frontend · E2E
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-test]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 后端用 mock provider 起：**离线可跑**，不花钱、不依赖外部 API，
      # 而前端要验证的是契约与渲染，不是模型质量。
      - name: Install backend deps
        working-directory: .
        run: pip install -r requirements.txt

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Start backend (mock providers)
        working-directory: .
        env:
          PET_AGENT_ALLOW_DEV_LOGIN: '1'
          PET_AGENT_AUTH_SECRET: ci-test-secret-not-for-production
          MOCK_PROVIDER: '1'
        run: |
          nohup python -m uvicorn app.bootstrap:create_app_from_env \
            --factory --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then
              echo "后端就绪"; exit 0
            fi
            sleep 1
          done
          echo "后端启动失败"; cat /tmp/backend.log; exit 1

      - name: Install e2e deps
        run: npm install -D jsdom --no-audit --no-fund

      - name: Smoke test
        run: node scripts/smoke.cjs dist http://127.0.0.1:8000

      - name: E2E test
        run: node scripts/e2e.cjs dist http://127.0.0.1:8000

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  # ===========================================================================
  # 构建镜像
  # ===========================================================================
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-e2e]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Frontend image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ===========================================================================
  # 部署
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/pet-agent

            # 拉取最新代码（含 compose / nginx 配置变更）
            git fetch --all --quiet
            git reset --hard origin/main

            # 构建并滚动重启
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 清理悬空镜像
            docker image prune -f

            # 等就绪
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1/healthz >/dev/null; then
                echo "✅ 部署成功"
                exit 0
              fi
              sleep 2
            done

            echo "❌ 健康检查超时"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=80
            exit 1
