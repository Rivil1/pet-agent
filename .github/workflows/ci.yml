name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # 1. 代码检查 (Lint & Type Check)
  # =============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install ruff pyright

      - name: Run Ruff
        run: |
          ruff check app/ tests/

      - name: Run Pyright
        run: |
          pyright app/

  # =============================================================================
  # 2. 单元测试
  # =============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  # =============================================================================
  # 3. 构建 Docker 镜像
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # 4. 部署到服务器 (main/master 分支)
  # =============================================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    environment:
      name: production
      url: https://pet-agent.example.com
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker Compose files
        run: |
          # 下载 docker-compose.yml 和配置文件
          echo "${{ vars.SERVER_CONFIG }}" | base64 -d > deploy/docker-compose.prod.yml
          echo "${{ vars.SERVER_ENV }}" | base64 -d > deploy/.env
          echo "${{ vars.NGINX_CONFIG }}" | base64 -d > deploy/nginx.conf

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          script: |
            # 创建部署目录
            mkdir -p /opt/pet-agent
            cd /opt/pet-agent
            
            # 拉取最新镜像
            docker pull ${{ needs.build.outputs.image-tag }}
            
            # 更新 docker-compose
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            
            services:
              pet-agent:
                image: ${{ needs.build.outputs.image-tag }}
                container_name: pet-agent
                restart: unless-stopped
                ports:
                  - "8000:8000"
                environment:
                  - PET_AGENT_AUTH_SECRET=${{ secrets.PET_AGENT_AUTH_SECRET }}
                  - ARK_API_KEY=${{ secrets.ARK_API_KEY }}
                  - PET_AGENT_EMBED_API_KEY=${{ secrets.PET_AGENT_EMBED_API_KEY }}
                  - PET_AGENT_EMBED_BASE_URL=${{ vars.PET_AGENT_EMBED_BASE_URL }}
                  - PET_AGENT_EMBED_MODEL=${{ vars.PET_AGENT_EMBED_MODEL }}
                env_file:
                  - .env
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
                networks:
                  - pet-network
                volumes:
                  - pet-data:/app/data
            
              nginx:
                image: nginx:alpine
                container_name: pet-nginx
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx.conf:/etc/nginx/nginx.conf:ro
                  - ./ssl:/etc/nginx/ssl:ro
                depends_on:
                  - pet-agent
                networks:
                  - pet-network
            
              redis:
                image: redis:7-alpine
                container_name: pet-redis
                restart: unless-stopped
                ports:
                  - "6379:6379"
                volumes:
                  - redis-data:/data
                networks:
                  - pet-network
            
            networks:
              pet-network:
                driver: bridge
            
            volumes:
              pet-data:
              redis-data:
            EOF
            
            # 拉取镜像并重启服务
            docker compose pull
            docker compose up -d
            
            # 清理旧镜像
            docker image prune -f
            
            # 检查服务状态
            sleep 10
            docker compose ps
            docker compose logs --tail=50 pet-agent

  # =============================================================================
  # 5. 通知 (可选)
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    
    steps:
      - name: Send notification
        if: needs.deploy.result == 'success'
        run: |
          echo "🎉 Deployment successful!"

      - name: Send failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          exit 1
