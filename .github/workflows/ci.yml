name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # 后端：静态检查
  # ===========================================================================
  backend-lint:
    name: Backend · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff pyright

      - name: Ruff
        run: ruff check app/ tests/

      - name: Pyright
        run: pyright app/

  # ===========================================================================
  # 后端：测试
  # ===========================================================================
  backend-test:
    name: Backend · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

  # ===========================================================================
  # 评测（不是测试 —— 它产出**数字**，而不只是通过/失败）
  # ===========================================================================
  eval:
    name: Eval · Baseline & Ablation
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 基线：离线可跑（HashEmbedder + MockLLM），不花钱、不依赖外部 API
      - name: Baseline eval
        run: python -m app.eval --strict --out reports

      # 消融：跑基线与全部对照组的差值。
      # 故障注入组（faulty-llm-unguarded）**预期就是失败** —— 它展示的
      # 是「没有守卫会怎样」，那个失败正是结论本身，所以这里不加 --strict。
      - name: Ablation eval
        run: python -m app.eval --ablation --out reports

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          retention-days: 30

      # 报告里若出现「本次对比无效」（实验组全崩），说明有配置跑不起来 ——
      # 那不该让构建红（可能是缺 secrets），但必须能被看见。
      - name: Warn on invalid comparisons
        run: |
          if grep -q '本次对比无效' reports/eval.md; then
            echo "::warning::报告里有「本次对比无效」—— 某组消融没跑起来"
          fi

  # ===========================================================================
  # 前端：静态检查 + 构建
  # ===========================================================================
  frontend-lint:
    name: Frontend · Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ===========================================================================
  # 前端：端到端（真后端 + 真构建产物）
  # ===========================================================================
  frontend-e2e:
    name: Frontend · E2E
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-test]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 后端用 mock provider 起：**离线可跑**，不花钱、不依赖外部 API，
      # 而前端要验证的是契约与渲染，不是模型质量。
      - name: Install backend deps
        working-directory: .
        run: pip install -r requirements.txt

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Start backend (mock providers)
        working-directory: .
        env:
          PET_AGENT_ALLOW_DEV_LOGIN: '1'
          PET_AGENT_AUTH_SECRET: ci-test-secret-not-for-production
          MOCK_PROVIDER: '1'
        run: |
          nohup python -m uvicorn app.bootstrap:create_app_from_env \
            --factory --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then
              echo "后端就绪"; exit 0
            fi
            sleep 1
          done
          echo "后端启动失败"; cat /tmp/backend.log; exit 1

      - name: Install e2e deps
        run: npm install -D jsdom --no-audit --no-fund

      - name: Smoke test
        run: node scripts/smoke.cjs dist http://127.0.0.1:8000

      - name: E2E test
        run: node scripts/e2e.cjs dist http://127.0.0.1:8000

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  # ===========================================================================
  # 构建镜像
  # ===========================================================================
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-e2e]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Frontend image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ===========================================================================
  # 部署
  #
  # ⚠️ 为什么不是「服务器 git pull」：
  # 这台服务器在境内，**连不上 github.com**（实测 `git fetch` 返回
  # `Empty reply from server`）。所以代码必须由 Actions 侧**推**过去，
  # 而不是让服务器自己拉。镜像也同理 —— 在服务器本地构建，
  # 走配好的国内镜像源（npm / pypi / debian / docker registry）。
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='*.log' \
            --exclude='.env' \
            -czf /tmp/pet-src.tar.gz .
          ls -lh /tmp/pet-src.tar.gz

      - name: Upload source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          source: /tmp/pet-src.tar.gz
          target: /root
          overwrite: true

      - name: Build & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd /opt/pet-agent

            # .env 只在服务器上，**不能被部署产物覆盖**（里面有真实密钥，
            # 而它在 .gitignore 里 —— 拉代码的路径永远拿不到它）。
            cp .env /root/pet-agent.env.backup

            # 清空（保留 .env），解包新代码
            find . -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
            tar -xzf /root/pet-src.tar.gz -C .
            cp /root/pet-agent.env.backup .env
            rm -f /root/pet-src.tar.gz

            # 服务器本地构建（走 .env 里的国内镜像源）
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # 等就绪：探的是 **Nginx → 后端** 的完整路径，
            # 而不是后端容器的直连端口 —— 后者通了前者也可能没通
            for i in $(seq 1 45); do
              if curl -sf http://127.0.0.1/healthz >/dev/null; then
                echo "✅ 部署成功"
                exit 0
              fi
              sleep 2
            done

            echo "❌ 健康检查超时"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=80
            exit 1
