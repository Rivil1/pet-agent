# =============================================================================
# pet-agent 前端站点：静态资源 + API 反代
# =============================================================================

upstream pet_backend {
    # docker-compose 的服务名即 DNS 名
    server pet-agent:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64M;

    # ── 压缩 ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── 安全头 ────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 带指纹的静态资源：长缓存 ─────────────────────────
    # Vite 给每个产物名带了内容哈希，所以可以放心 immutable。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 字体同属指纹产物
    location ~* \.(woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 健康检查（Nginx 自身） ───────────────────────────
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API 反代 ─────────────────────────────────────────
    # 前端用相对路径调 /v1 与 /healthz —— 同源，因此不需要 CORS 配置，
    # 也不需要把后端地址编译进产物（换环境不用重新构建）。
    location /v1/ {
        proxy_pass http://pet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 会话与链路标识由后端生成/回传，必须透传
        proxy_pass_request_headers on;

        # 一次对话要跑完整张图（含视觉/多模态），给足时间
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://pet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /openapi.json {
        proxy_pass http://pet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /docs {
        proxy_pass http://pet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ── SPA 回退 ─────────────────────────────────────────
    # 前端用 hash 路由，理论上不需要 fallback；
    # 但保留它是为了将来换成 history 路由时不必再想起来加。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 隐私 ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
