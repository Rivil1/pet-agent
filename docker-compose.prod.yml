# =============================================================================
# pet-agent 生产环境
#
# 拓扑：
#   web (nginx + 静态产物)  ──/v1──►  pet-agent (uvicorn)
#        ↑ 唯一对外暴露的入口
#
# 为什么后端不直接暴露端口：所有请求都应经过同一层，
# 否则会出现「绕过 Nginx 直连 8000」的路径，而那条路径没有安全头、
# 没有压缩、也没有统一的超时设置 —— 一个只在生产才存在的差异。
#
# mysql / milvus 用 profiles 挂起：目前存储层仍是 InMemoryStore
# （见 app/store/memory.py），起了也接不上，白占资源。
# 接入后去掉 profiles 即可。
# =============================================================================

services:
  # ── 前端 + 反向代理 ──────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 国内服务器走镜像源；云端 CI 传官方源
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
    image: pet-agent-web:latest
    container_name: pet-web
    restart: unless-stopped
    ports:
      - "80:80"
      # 配好证书后打开
      # - "443:443"
    depends_on:
      pet-agent:
        condition: service_healthy
    networks:
      - pet-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 后端 ─────────────────────────────────────────────
  pet-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: pet-agent-api:latest
    container_name: pet-agent
    restart: unless-stopped
    # 只在回环上暴露，便于服务器本机排查；不对外
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    healthcheck:
      # 写 127.0.0.1 而不是 localhost：容器内 localhost 会先走 IPv6 `::1`，
      # 而 uvicorn --host 0.0.0.0 只监听 IPv4。curl 会自动回退，
      # 但依赖「客户端恰好会回退」不是一个健康检查该有的前提。
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pet-net
    deploy:
      resources:
        limits:
          memory: 1500M

  # ── 数据服务（接入后启用） ───────────────────────────
  #
  # 用法：docker compose --profile data up -d
  #
  # MySQL：主库（宠物档案 / 记忆 / 会话 / 健康记录）
  #
  # ⚠️ 这里的密码用默认值而不是 `${VAR:?必填}`：
  # compose 会对**未启用 profile 的服务也做变量插值**，
  # 于是 `--profile data` 没开的时候，一个缺失的变量就能让整次 build 失败。
  # 真正启用 data profile 前必须先把这些值改掉（见 .env.example）。
  mysql:
    profiles: ["data"]
    image: mysql:8.4
    container_name: pet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pet_agent}
      MYSQL_USER: ${MYSQL_USER:-pet_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-before-using-data-profile}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-before-using-data-profile}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # ⚠️ 只绑回环，**不对外**。
      #
      # 本地开发需要连线上库时走 SSH 隧道（scripts/db-tunnel.sh）：
      #     ssh -N -L 13306:127.0.0.1:3306 root@47.102.186.248
      #
      # 为什么不直接 "3306:3306"：那会把数据库暴露到公网。
      # 而本项目整个隔离主张的前提就是「user_id 不可伪造」——
      # 一个公网可达的库把「不可伪造」降级成「密码别泄露」，
      # 与 D5 的取向直接矛盾。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-before-using-data-profile}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - pet-net

  # Milvus：向量库（语义召回）
  #
  # 用 standalone + 内置 etcd（ETCD_USE_EMBED）省掉两个额外容器 ——
  # 单机小规模下外置 etcd 没有收益，只是多两个要维护的东西。
  milvus:
    profiles: ["data"]
    image: milvusdb/milvus:v2.4.15
    container_name: pet-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - pet-net

  redis:
    profiles: ["data"]
    image: redis:7-alpine
    container_name: pet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - pet-net

networks:
  pet-net:
    driver: bridge

volumes:
  mysql-data:
  milvus-data:
  redis-data:
